services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TPS_DB_USER:?Set TPS_DB_USER in .env}
      POSTGRES_PASSWORD: ${TPS_DB_PASSWORD:?Set TPS_DB_PASSWORD in .env}
      POSTGRES_DB: ${TPS_DB_NAME:?Set TPS_DB_NAME in .env}
    ports:
      - "127.0.0.1:${TPS_DB_PORT:-54329}:5432"
    volumes:
      - tps_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  tps_pgdata:
