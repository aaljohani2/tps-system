name: TPS checks
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit
      - run: npm test
  xlsx-import-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_*.py' -v
  java-timefold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: solver/pom.xml
      - run: mvn -B -ntp -f solver/pom.xml clean verify package
      - uses: actions/upload-artifact@v4
        with:
          name: tps-timefold-jar
          path: solver/target/tps-timefold-0.2.0-jar-with-dependencies.jar
          retention-days: 7
