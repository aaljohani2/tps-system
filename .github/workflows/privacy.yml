name: Public source privacy guard
on:
  pull_request:
  push:
    branches: [main, 'feat/**', 'fix/**', 'security/**']
permissions:
  contents: read
jobs:
  inspect-public-text:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Reject institutional names and personal data from tracked public text
        run: node scripts/check-public-privacy.mjs
